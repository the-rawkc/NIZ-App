# Render Blueprint Configuration for NIZ Chat (Free Tier PaaS)
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: niz-chat-db
    databaseName: niz_chat
    user: niz_user
    plan: free
    region: oregon

services:
  # 1. NIZ Chat Backend Server (Fastify API & Real-time WebSocket Push)
  - type: web
    name: niz-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node apps/server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: STORAGE_ADAPTER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: niz-chat-db
          property: connectionString
      - key: CORS_ORIGIN
        value: '*'
    healthCheckPath: /health

  # 2. NIZ Web Client (Static SPA with Client-Side Double Ratchet E2EE)
  - type: web
    name: niz-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build --workspace=@niz/shared-types && npm run build --workspace=@niz/validation && npm run build --workspace=@niz/crypto-core && npm run build --workspace=@niz/ui && npm run build --workspace=@niz/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. NIZ Admin Console (Isolated Operations Plane)
  - type: web
    name: niz-admin
    runtime: static
    buildCommand: npm ci --include=dev && npm run build --workspace=@niz/shared-types && npm run build --workspace=@niz/validation && npm run build --workspace=@niz/ui && npm run build --workspace=@niz/admin
    staticPublishPath: apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
