version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: niz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: niz_user
      POSTGRES_PASSWORD: niz_dev_password
      POSTGRES_DB: niz_chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/server/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niz_user -d niz_chat"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
